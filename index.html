<script>
/* ===== EDIT SCHOOL DETAILS HERE ===== */
const P={n:'Government High School Zoogu',a:'Zoogu, Arizal, Budgam, Kashmir',ph:'+91 9596470834',em:'ghszoogu121@gmail.com'};
const $=s=>document.querySelector(s),app=$('#app'),H={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ST=['Pending','Approved','Rejected','Waitlisted'],CL=['6','7','8','9','10'],DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const STATES='Andaman and Nicobar Islands|Andhra Pradesh|Arunachal Pradesh|Assam|Bihar|Chandigarh|Chhattisgarh|Dadra and Nagar Haveli and Daman and Diu|Delhi|Goa|Gujarat|Haryana|Himachal Pradesh|Jammu and Kashmir|Jharkhand|Karnataka|Kerala|Ladakh|Lakshadweep|Madhya Pradesh|Maharashtra|Manipur|Meghalaya|Mizoram|Nagaland|Odisha|Puducherry|Punjab|Rajasthan|Sikkim|Tamil Nadu|Telangana|Tripura|Uttar Pradesh|Uttarakhand|West Bengal'.split('|');
const CATS=['General','OBC','SC','ST','EWS'];
const NAV=[['home','Home','मुख्य पृष्ठ'],['about','About','परिचय'],['notices','Notices','सूचनाएँ'],['apply','Apply online','ऑनलाइन प्रवेश'],['status','Check status','स्थिति जाँचें'],['contact','Contact','संपर्क'],['events','Events','कार्यक्रम'],['admin','Admin login','एडमिन लॉगिन']];
const TX={t:['Government High School Zoogu','सरकारी उच्च विद्यालय ज़ूगू'],s:['Free, quality schooling for every child. Admissions for 2027–28 are open to students from anywhere in India.','हर बच्चे के लिए निःशुल्क, गुणवत्तापूर्ण शिक्षा। सत्र 2027–28 के लिए प्रवेश भारत में कहीं से भी खुले हैं।']};
let lang='en',AD=false,tab='dash',AP=[],CSVR=[];try{AD=sessionStorage.getItem('adm')=='1'}catch(e){}
const t=k=>TX[k][lang=='hi'?1:0];

/* ===== DATA LAYER: Firebase (free Spark plan). If Firebase cannot load, the page runs in local demo mode. ===== */
const CFG={apiKey:'AIzaSyB0q5pUQcdNmqk2OmAM6iOQSlpei34eAww',authDomain:'government-high-school-zoogu.firebaseapp.com',projectId:'government-high-school-zoogu',storageBucket:'government-high-school-zoogu.firebasestorage.app',messagingSenderId:'346155774660',appId:'1:346155774660:web:cc6f77f646ae4b32b9cf91',adminEmail:'ghszoogu121@gmail.com'};
const FB=typeof firebase!=='undefined';
let fs,auth,authReady,fbLogin,S;
const ls={g:c=>{try{return JSON.parse(localStorage.getItem('gs_'+c)||'[]')}catch(e){return[]}},s:(c,a)=>{try{localStorage.setItem('gs_'+c,JSON.stringify(a))}catch(e){}}};
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;document.body.append(a);a.click();a.remove()};
if(FB){
 firebase.initializeApp(CFG);fs=firebase.firestore();auth=firebase.auth();
 authReady=new Promise(r=>{const u=auth.onAuthStateChanged(x=>{u();r(x)})});
 authReady.then(u=>{if(AD&&!u){AD=false;go()}});
 fbLogin=async pw=>{try{await auth.signInWithEmailAndPassword(CFG.adminEmail,pw);return true}catch(e){return false}};
 S={
  async all(c){await authReady;try{return(await fs.collection(c).get()).docs.map(d=>d.data())}catch(e){return[]}},
  async one(c,id){await authReady;try{const d=await fs.collection(c).doc(id).get();return d.exists?d.data():null}catch(e){return null}},
  async put(c,o){await authReady;await fs.collection(c).doc(o.id).set(o)},
  async del(c,id){await authReady;await fs.collection(c).doc(id).delete()}
 };
 $('#md').textContent='Online database connected';
}else{
 auth={signOut(){}};authReady=Promise.resolve(null);
 fbLogin=async pw=>(await sha(pw))==='5f75778b798762a171f466069348c4a4619f66f577f6ff9e3869685b7a55eb2b';
 S={async all(c){return ls.g(c)},async one(c,id){return ls.g(c).find(x=>x.id===id)||null},async put(c,o){const a=ls.g(c).filter(x=>x.id!==o.id);a.push(o);ls.s(c,a)},async del(c,id){ls.s(c,ls.g(c).filter(x=>x.id!==id))}};
 $('#md').textContent='Demo mode (no database)';
 document.body.insertAdjacentHTML('afterbegin','<div style="background:#b3261e;color:#fff;padding:6px 12px;text-align:center;font-size:14px;position:relative;z-index:40">Demo mode: the online database is not connected, so nothing entered here is saved for the school.</div>');
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== PUBLIC PAGES ===== */
const opts=a=>a.map(v=>`<option>${v}</option>`).join('');
const V={
async home(){const n=(await S.all('notices')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
return `<section class="hero"><div class="w"><h1>${t('t')}</h1><p>${t('s')}</p><a class="b" href="#apply">${NAV[3][lang=='hi'?2:1]}</a><a class="b o" href="#status">${NAV[4][lang=='hi'?2:1]}</a></div></section>
<div class="tk"><div class="w"><b>${lang=='hi'?'सूचना':'Notice'}</b><span class="mq">${n[0]?esc(n[0].title):'Admissions for 2027–28 are open. Apply online.'}</span></div></div>
<div class="w sec"><h2>School at a glance</h2><dl><dt>Classes</dt><dd>6 to 10</dd><dt>Medium</dt><dd>Hindi and English</dd><dt>Admission</dt><dd>Online, open to all of India</dd><dt>Office hours</dt><dd>Monday to Saturday, 9 am – 4 pm</dd></dl>
<h2 style="margin-top:28px">Message from the Principal</h2><blockquote>“Every child who walks through our gate deserves patient teaching, a safe classroom and a fair chance. We work with parents and the community to make that real, every day.”</blockquote></div>`},
async about(){return `<div class="w sec"><h2>About our school</h2><p>${esc(P.n)} is a government school that offers free education from Class 6 to Class 10. We follow the state curriculum with regular tests, library time, sports and community events.</p><p>We are located at ${esc(P.a)}. Parents and guardians can apply online, track an application and reach the office by phone or email.</p></div>`},
async notices(){const n=(await S.all('notices')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
return `<div class="w sec"><h2>Notices and circulars</h2>${n.map(x=>`<div class="card"><b>${esc(x.title)}</b> <small>${esc(x.date)}</small><p>${esc(x.text)}</p></div>`).join('')||'<p>No notices have been posted yet.</p>'}</div>`},
async contact(){return `<div class="w sec"><h2>Contact us</h2><dl><dt>Address</dt><dd>${esc(P.a)}</dd><dt>Phone</dt><dd><a href="tel:+919596470834">${esc(P.ph)}</a></dd><dt>Email</dt><dd><a href="mailto:${esc(P.em)}">${esc(P.em)}</a></dd></dl><p><a href="https://www.google.com/maps/search/?api=1&amp;query=Zoogu+Arizal+Budgam" target="_blank" rel="noopener">Open in Google Maps</a></p><h3 style="margin-top:24px">Send us a message</h3><form id="cf" class="card"><div class="g"><label>Your name<input name="name" required></label><label>Mobile<input name="ph" type="tel" required></label><label style="grid-column:1/-1">Message<textarea name="text" required></textarea></label></div><p class="er" id="cm"></p><button class="b">Send message</button></form></div>`},
async events(){const n=(await S.all('events')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="w sec"><h2>Events and calendar</h2>${n.map(x=>`<div class="card"><b>${esc(x.title)}</b> <small>${esc(x.date)}</small><p>${esc(x.text)}</p></div>`).join('')||'<p>No events have been posted yet.</p>'}</div>`},
async apply(){const f=(k,l,x='text',extra='')=>`<label>${l}<input name="${k}" type="${x}" ${extra}></label>`,s=(k,l,a)=>`<label>${l}<select name="${k}" required><option value="">Select</option>${opts(a)}</select></label>`;
return `<div class="w sec"><h2>Online admission 2027–28</h2><form id="af" class="card"><div class="g">
${f('name','Student’s full name','text','required')}${f('dob','Date of birth','date','required')}${s('gender','Gender',['Male','Female','Other'])}${s('cat','Category',CATS)}${s('cls','Class applying for',CL)}
${f('prev','Previous school','text','required')}${f('marks','Previous marks (%)','number','min=0 max=100 step=any')}${f('father','Father’s name','text','required')}${f('mother','Mother’s name','text','required')}
${f('phone','Guardian mobile (10 digits)','tel','required maxlength=10 inputmode=numeric')}${f('email','Email','email')}${s('state','State or UT',STATES)}${f('district','District','text','required')}${f('pin','PIN code','tel','required maxlength=6 inputmode=numeric')}${f('aad','Aadhaar last 4 digits (optional)','tel','maxlength=4 inputmode=numeric')}
<label style="grid-column:1/-1">Full address<textarea name="addr" required></textarea></label></div><p class="er" id="am"></p><button class="b">Submit application</button></form></div>`},
async status(){return `<div class="w sec"><h2>Check admission status</h2><form id="sf" class="card"><div class="g"><label>Application ID<input name="id" required></label><label>Guardian mobile<input name="ph" type="tel" required maxlength=10></label></div><p class="er" id="sm"></p><button class="b">Check status</button></form><div id="sr"></div></div>`},
async admin(){return AD?`<div class="w sec"><div class="tabs np" id="tb">${[['dash','Dashboard'],['adm','Admissions'],['set','Exam settings'],...Object.entries(M).map(([k,c])=>[k,c.n])].map(([k,n])=>`<button class="s ${k==tab?'on':''}" data-a="tab" data-t="${k}">${n}</button>`).join('')}<button class="s" data-a="out">Log out</button></div><div id="ac"></div></div>`
:`<div class="w sec"><h2>Admin login</h2><p>Enter the admin password to manage admissions, students and school records.</p><form id="lf" class="card" style="max-width:380px"><label>Password<input name="pw" type="password" required autocomplete="current-password"></label><p class="er" id="lm"></p><button class="b">Log in</button></form></div>`}
};
const slip=d=>`<div class="w sec"><div class="card"><h2>Application received</h2><p>Application ID: <b style="font-size:24px">${d.id}</b></p><p>Student: ${esc(d.name)} · Class ${esc(d.cls)}<br>Guardian mobile: ${esc(d.phone)}<br>Date: ${new Date().toLocaleDateString('en-IN')}</p>${d.exam!=null?`<p>Entrance test score: <b>${d.exam}/${d.exTotal}</b> (${d.exPass?'Passed':'Below pass mark'})</p>`:''}<p>Keep this ID. You need it with your mobile number to check status.</p><button class="b np" data-a="print">Print acknowledgement</button></div></div>`;
H.af=async f=>{const d=Object.fromEntries(new FormData(f)),m=$('#am');
 const bad=!/^[6-9]\d{9}$/.test(d.phone)?'Enter a valid 10-digit mobile number.':!/^[1-9]\d{5}$/.test(d.pin)?'Enter a valid 6-digit PIN code.':d.aad&&!/^\d{4}$/.test(d.aad)?'Aadhaar: enter only the last 4 digits.':'';
 if(bad){m.textContent=bad;return}
 const b=f.querySelector('button');b.disabled=true;b.textContent='Submitting…';m.textContent='';
 try{const k=await sha([d.name,d.dob,d.phone].join('|').toLowerCase()),ph=await sha(d.phone);
  if(await S.one('dups',k))throw new Error('An application for this student already exists. Use “Check status” instead.');
  d.id='GHS'+Math.random().toString(36).slice(2,8).toUpperCase()+String(Date.now()).slice(-3);d.st='Pending';d.at=new Date().toISOString().slice(0,10);
  await S.put('applications',d);await S.put('status',{id:d.id,ph,k,st:'Pending',cls:d.cls});await S.put('dups',{id:k});const c=await exCfg();if(c.on&&req(c,d.cls)){EXID=d.id;location.hash='exam'}else{app.innerHTML=slip(d);scrollTo(0,0)}
 }catch(e){m.textContent=e.message||'Could not submit. Please try again.';b.disabled=false;b.textContent='Submit application'}};
H.sf=async f=>{const m=$('#sm'),id=f.elements.id.value.trim().toUpperCase();m.textContent='';
 const o=await S.one('status',id);
 if(!o||o.ph!==await sha(f.elements.ph.value.trim())){$('#sr').innerHTML='';m.textContent='No application found for this ID and mobile number.';return}
 const c=await exCfg();$('#sr').innerHTML=`<div class="card"><p>Application <b>${esc(id)}</b></p><span class="bd ${o.st}">${o.st}</span>${o.ex!=null?(c.show?`<p>Entrance test score: <b>${o.ex}</b> (${o.exPass?'Passed':'Below pass mark'})</p>`:'<p>Entrance test submitted.</p>'):c.on&&req(c,o.cls)?`<p>Entrance test not taken yet.</p><a class="b" href="#exam" data-a="ex" data-id="${esc(id)}">Take entrance test</a>`:''}</div>`};
H.lf=async f=>{const m=$('#lm');let L={};try{L=JSON.parse(localStorage.getItem('gs_lock')||'{}')}catch(e){}
 if(L.u>Date.now()){m.textContent='Too many attempts. Try again in '+Math.ceil((L.u-Date.now())/6e4)+' min.';return}
 if(await fbLogin(f.pw.value)){AD=true;try{sessionStorage.setItem('adm','1');localStorage.removeItem('gs_lock')}catch(e){}go();return}
 L.n=(L.n||0)+1;if(L.n>=5){L={u:Date.now()+3e5};m.textContent='Locked for 5 minutes.'}else m.textContent='Wrong password. '+(5-L.n)+' tries left.';
 try{localStorage.setItem('gs_lock',JSON.stringify(L))}catch(e){}};
H.cf=async f=>{const r=Object.fromEntries(new FormData(f)),m=$('#cm');r.id=uid();r.ts=Date.now();r.date=new Date().toISOString().slice(0,10);try{await S.put('messages',r);f.reset();m.style.color='var(--grn)';m.textContent='Message sent. We will call you back.'}catch(e){m.style.color='var(--er)';m.textContent='Could not send. Please try again.'}};
